name: PyQPanda Algorithm CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Build the pure-Python wheel once and share it with every gate.
  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel pyqpanda-algorithm

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pyqpanda_alg-wheel
          path: pyqpanda-algorithm/dist/*.whl
          retention-days: 7

  # Install the built wheel into a clean virtual environment on the
  # verified Python/platform matrix and run the repository test suite
  # against the installed package.
  test:
    name: Test installed wheel (${{ matrix.python-version }} / ${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: pyqpanda_alg-wheel
          path: pyqpanda-algorithm/dist/

      - name: Install wheel into clean environment
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON=".venv/Scripts/python.exe"
          else
            PYTHON=".venv/bin/python"
          fi
          "$PYTHON" -m pip install --upgrade pip
          WHEEL="$(ls pyqpanda-algorithm/dist/*.whl | head -n 1)"
          "$PYTHON" -m pip install "$WHEEL[test]"

      - name: Run tests against installed wheel
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON=".venv/Scripts/python.exe"
          else
            PYTHON=".venv/bin/python"
          fi
          "$PYTHON" -m pytest test -q

  # Build the Sphinx documentation with the theme declared in conf.py.
  docs:
    name: Build documentation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: python -m pip install Sphinx sphinx-autoapi sphinx-material

      - name: Build HTML documentation
        run: |
          cd Tutorials/source
          python -m sphinx -b html -W . build/html

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: Tutorials/source/build/html
          retention-days: 7

  # Release artifacts are assembled only after every gate succeeds;
  # GitHub Actions skips this job when any dependency fails.
  release:
    name: Assemble release artifacts
    needs: [build, test, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: pyqpanda_alg-wheel
          path: release_package/wheels/

      - name: Download documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation-html
          path: release_package/docs/

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release_package/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77  # v1
        with:
          files: |
            release_package/wheels/*.whl
            release_package/docs/index.html
