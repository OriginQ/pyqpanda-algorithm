<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Family-level selector-all resource reductions</title>
  <desc id="desc">Heatmap of preregistered family medians for Walsh and Fourier compiled two-qubit gates and depth.</desc>
