<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Selector-all resource reduction by dimension</title>
  <desc id="desc">Descriptive cell-level medians for Walsh and Fourier, compiled two-qubit gates and depth, from N 8 to 64.</desc>
  <rect width="900" height="500" rx="18" fill="#f8fafc"/>
  <text x="70" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033">Selector-all reduction by dimension</text>
  <text x="70" y="67" font-family="Arial, sans-serif" font-size="13" fill="#526079">Descriptive medians over 60 cells at each basis and N; not the preregistered Gate aggregation</text>
  <g stroke="#d9e0ea" stroke-width="1">
    <line x1="120" y1="400" x2="790" y2="400"/><line x1="120" y1="340" x2="790" y2="340"/><line x1="120" y1="280" x2="790" y2="280"/><line x1="120" y1="220" x2="790" y2="220"/><line x1="120" y1="160" x2="790" y2="160"/><line x1="120" y1="100" x2="790" y2="100"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="end">
    <text x="110" y="404">0%</text><text x="110" y="344">20%</text><text x="110" y="284">40%</text><text x="110" y="224">60%</text><text x="110" y="164">80%</text><text x="110" y="104">100%</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">
    <text x="170" y="425">N=8</text><text x="360" y="425">N=16</text><text x="550" y="425">N=32</text><text x="740" y="425">N=64</text>
  </g>
  <polyline points="170,400 360,313 550,175 740,118" fill="none" stroke="#2563eb" stroke-width="4"/>
  <polyline points="170,370 360,301 550,181 740,124" fill="none" stroke="#60a5fa" stroke-width="4" stroke-dasharray="9 6"/>
  <polyline points="170,388 360,304 550,190 740,124" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <polyline points="170,382 360,304 550,202 740,130" fill="none" stroke="#c084fc" stroke-width="4" stroke-dasharray="9 6"/>
  <g fill="#2563eb"><circle cx="170" cy="400" r="5"/><circle cx="360" cy="313" r="5"/><circle cx="550" cy="175" r="5"/><circle cx="740" cy="118" r="5"/></g>
  <g fill="#60a5fa"><circle cx="170" cy="370" r="5"/><circle cx="360" cy="301" r="5"/><circle cx="550" cy="181" r="5"/><circle cx="740" cy="124" r="5"/></g>
  <g fill="#7c3aed"><circle cx="170" cy="388" r="5"/><circle cx="360" cy="304" r="5"/><circle cx="550" cy="190" r="5"/><circle cx="740" cy="124" r="5"/></g>
  <g fill="#c084fc"><circle cx="170" cy="382" r="5"/><circle cx="360" cy="304" r="5"/><circle cx="550" cy="202" r="5"/><circle cx="740" cy="130" r="5"/></g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#334155">
    <line x1="120" y1="460" x2="150" y2="460" stroke="#2563eb" stroke-width="4"/><text x="158" y="464">Walsh 2q</text>
    <line x1="270" y1="460" x2="300" y2="460" stroke="#60a5fa" stroke-width="4" stroke-dasharray="8 5"/><text x="308" y="464">Walsh depth</text>
    <line x1="445" y1="460" x2="475" y2="460" stroke="#7c3aed" stroke-width="4"/><text x="483" y="464">Fourier 2q</text>
    <line x1="610" y1="460" x2="640" y2="460" stroke="#c084fc" stroke-width="4" stroke-dasharray="8 5"/><text x="648" y="464">Fourier depth</text>
  </g>
</svg>
